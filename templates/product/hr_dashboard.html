<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaxCopilot HR Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>

body{
font-family:'DM Sans',sans-serif;
background:#F7F9FC;
margin:0;
}

/* NAV */

nav{
background:white;
padding:15px 5%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #eee;
}

.logo{
font-family:'Sora',sans-serif;
font-weight:700;
font-size:18px;
color:#185FA5;
}

.logout{
background:#185FA5;
color:white;
border:none;
padding:8px 16px;
border-radius:6px;
cursor:pointer;
}

/* DASHBOARD */

.container{
padding:40px 5%;
}

h1{
font-family:'Sora',sans-serif;
margin-bottom:30px;
}

/* METRICS */

.metrics{
display:flex;
gap:20px;
margin-bottom:30px;
flex-wrap:wrap;
}

.card{
background:white;
padding:20px;
border-radius:10px;
flex:1;
min-width:200px;
border:1px solid #eee;
}

.card h3{
margin:0;
font-size:14px;
color:#888;
}

.card p{
font-size:28px;
font-weight:600;
margin:8px 0 0 0;
}

/* TABLE */

table{
width:100%;
background:white;
border-radius:10px;
border-collapse:collapse;
overflow:hidden;
}

th,td{
padding:12px;
text-align:left;
border-bottom:1px solid #eee;
}

th{
background:#f5f6fa;
font-size:13px;
}

.status{
padding:4px 8px;
border-radius:4px;
font-size:12px;
}

.filed{
background:#E1F5EE;
color:#0F6E56;
}

.pending{
background:#FAEEDA;
color:#854F0B;
}

.review{
background:#E6F1FB;
color:#185FA5;
}

.add-btn{
margin-top:20px;
background:#185FA5;
color:white;
border:none;
padding:10px 18px;
border-radius:6px;
cursor:pointer;
}

</style>
</head>

<body>

<nav>
<div class="logo">TaxCopilot HR</div>
<button class="logout">Logout</button>
</nav>

<div class="container">

<h1>Employee Tax Filing Dashboard</h1>

<div class="metrics">

<div class="card">
<h3>Total Employees</h3>
<p>248</p>
</div>

<div class="card">
<h3>ITR Filed</h3>
<p>187</p>
</div>

<div class="card">
<h3>Pending</h3>
<p>61</p>
</div>

</div>

<table>

<thead>
<tr>
<th>Name</th>
<th>Department</th>
<th>Tax Regime</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody>

<tr>
<td>Priya Sharma</td>
<td>Engineering</td>
<td>New</td>
<td><span class="status filed">Filed</span></td>
<td>View</td>
</tr>

<tr>
<td>Rahul Verma</td>
<td>Product</td>
<td>Old</td>
<td><span class="status filed">Filed</span></td>
<td>View</td>
</tr>

<tr>
<td>Ananya Iyer</td>
<td>Design</td>
<td>—</td>
<td><span class="status pending">Pending</span></td>
<td>Send Reminder</td>
</tr>

<tr>
<td>Karan Mehta</td>
<td>Engineering</td>
<td>New</td>
<td><span class="status review">CA Review</span></td>
<td>View</td>
</tr>

</tbody>

</table>

<button class="add-btn">+ Add Employee</button>

</div>

</body>
</html>
